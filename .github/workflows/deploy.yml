# ─── .github/workflows/deploy.yml ───────────────────────────────
name: إن مصر للصناعة — CI/CD Pipeline

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/inmisr-api

jobs:

  # ── 1. LINT & TEST ─────────────────────────────────────────────
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: inmisr_test
          POSTGRES_USER: inmisr
          POSTGRES_PASSWORD: testpass
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://inmisr:testpass@localhost:5432/inmisr_test

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test -- --coverage
        env:
          DATABASE_URL: postgresql://inmisr:testpass@localhost:5432/inmisr_test
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: test_access_secret_for_ci
          JWT_REFRESH_SECRET: test_refresh_secret_for_ci
          NODE_ENV: test

      - name: E2E tests
        run: npm run test:e2e
        env:
          DATABASE_URL: postgresql://inmisr:testpass@localhost:5432/inmisr_test
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: test_access_secret_for_ci
          JWT_REFRESH_SECRET: test_refresh_secret_for_ci
          NODE_ENV: test

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  # ── 2. SECURITY SCAN ───────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Run npm audit
        run: npm audit --audit-level=high

      - name: Snyk vulnerability scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      - name: Trivy Docker scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'

  # ── 3. BUILD & PUSH DOCKER IMAGE ──────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}

  # ── 4. DEPLOY TO STAGING ───────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/staging'
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: me-south-1

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name inmisr-staging --region me-south-1

      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/inmisr-api \
            api=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging \
            --namespace=staging

          kubectl rollout status deployment/inmisr-api \
            --namespace=staging \
            --timeout=5m

      - name: Run smoke tests
        run: |
          STAGING_URL="https://api-staging.inmisr.net"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" $STAGING_URL/api/v1/health)
          if [ $STATUS -ne 200 ]; then
            echo "❌ Smoke test failed: HTTP $STATUS"
            kubectl rollout undo deployment/inmisr-api --namespace=staging
            exit 1
          fi
          echo "✅ Staging deployment healthy"

  # ── 5. DEPLOY TO PRODUCTION ────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: me-south-1

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name inmisr-production --region me-south-1

      - name: Run DB migrations
        run: |
          kubectl run prisma-migrate \
            --image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            --env="DATABASE_URL=${{ secrets.PROD_DATABASE_URL }}" \
            --restart=Never \
            --namespace=production \
            -- npx prisma migrate deploy
          kubectl wait --for=condition=complete \
            job/prisma-migrate --namespace=production --timeout=120s

      - name: Blue-Green deployment
        run: |
          # Update image with rolling strategy
          kubectl set image deployment/inmisr-api \
            api=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            --namespace=production

          # Wait for rollout
          kubectl rollout status deployment/inmisr-api \
            --namespace=production \
            --timeout=10m

      - name: Production smoke tests
        run: |
          sleep 30
          PROD_URL="https://api.inmisr.net"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" $PROD_URL/api/v1/health)
          if [ $STATUS -ne 200 ]; then
            echo "❌ Production smoke test FAILED — rolling back!"
            kubectl rollout undo deployment/inmisr-api --namespace=production
            exit 1
          fi
          echo "✅ Production deployment successful!"

      - name: Notify Slack on success
        if: success()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "✅ *إن مصر للصناعة* deployed to production successfully!\nCommit: `${{ github.sha }}`\nBy: ${{ github.actor }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "🚨 *إن مصر للصناعة* production deployment FAILED!\nCommit: `${{ github.sha }}`\nRolling back automatically."
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
