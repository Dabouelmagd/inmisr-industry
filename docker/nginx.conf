# ─── nginx.inmisr.net.conf ────────────────────────────────────────
# Nginx Production Config — inmisr.net
# داتا لايف لخدمات الذكاء الصناعي

worker_processes auto;
events { worker_connections 4096; use epoll; multi_accept on; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Logging
  log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent "$http_referer" $request_time';
  access_log /var/log/nginx/access.log main buffer=16k;
  error_log  /var/log/nginx/error.log warn;

  # Performance
  sendfile on; tcp_nopush on; tcp_nodelay on;
  keepalive_timeout 75; types_hash_max_size 2048;

  # Gzip
  gzip on; gzip_vary on; gzip_min_length 1024; gzip_comp_level 6;
  gzip_types text/plain text/css application/json application/javascript text/xml;

  # Security headers (global)
  add_header X-Frame-Options SAMEORIGIN always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

  # Rate limiting zones
  limit_req_zone $binary_remote_addr zone=api:10m      rate=100r/m;
  limit_req_zone $binary_remote_addr zone=auth:10m     rate=10r/m;
  limit_req_zone $binary_remote_addr zone=webhooks:10m rate=60r/m;
  limit_conn_zone $binary_remote_addr zone=conn:10m;

  # Upstreams
  upstream api_backend   { server 127.0.0.1:3001; keepalive 32; }
  upstream frontend_back { server 127.0.0.1:3000; keepalive 16; }

  # ── HTTP → HTTPS redirect ─────────────────────────────────────────
  server {
    listen 80;
    server_name inmisr.net www.inmisr.net api.inmisr.net app.inmisr.net;
    return 301 https://$host$request_uri;
  }

  # ── MAIN WEBSITE — inmisr.net + www.inmisr.net ────────────────────
  server {
    listen 443 ssl http2;
    server_name inmisr.net www.inmisr.net app.inmisr.net;

    ssl_certificate     /etc/nginx/ssl/inmisr.net/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/inmisr.net/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on; ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.paymob.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.amazonaws.com https://*.cloudfront.net; connect-src 'self' wss://inmisr.net; frame-src https://accept.paymob.com;" always;

    limit_conn conn 20;
    client_max_body_size 50M;

    # Frontend (Next.js)
    location / {
      proxy_pass         http://frontend_back;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection 'upgrade';
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;

      # Cache static assets
      location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        proxy_pass http://frontend_back;
      }
    }

    # WebSocket for real-time notifications
    location /socket.io/ {
      proxy_pass         http://api_backend;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_read_timeout 86400;
    }
  }

  # ── API — api.inmisr.net ──────────────────────────────────────────
  server {
    listen 443 ssl http2;
    server_name api.inmisr.net;

    ssl_certificate     /etc/nginx/ssl/inmisr.net/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/inmisr.net/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    client_max_body_size 50M;

    # General API
    location /api/v1/ {
      limit_req  zone=api burst=20 nodelay;
      limit_conn conn 10;

      proxy_pass         http://api_backend;
      proxy_http_version 1.1;
      proxy_set_header   Connection "";
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 30s;
    }

    # Auth endpoints — stricter limits
    location ~ ^/api/v1/auth/(login|register|forgot-password|otp) {
      limit_req zone=auth burst=3 nodelay;
      proxy_pass http://api_backend;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # Paymob webhook — allow their IPs
    location /webhooks/paymob/ {
      limit_req zone=webhooks burst=30 nodelay;
      # Paymob IP allowlist (update from their docs)
      allow 197.49.0.0/16;
      allow 197.166.0.0/16;
      deny all;
      proxy_pass http://api_backend;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # File uploads
    location /api/v1/upload {
      limit_req zone=api burst=5;
      client_max_body_size 50M;
      proxy_pass http://api_backend;
      proxy_read_timeout 120s;
    }

    # Swagger Docs — internal only (remove in prod)
    location /docs {
      # Uncomment to restrict:
      # allow 10.0.0.0/8; deny all;
      proxy_pass http://api_backend;
    }

    # Health check — always open
    location /api/v1/health {
      proxy_pass http://api_backend;
      access_log off;
    }
  }
}
